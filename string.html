<!DOCTYPE html>
<html>
<body bgcolor="violet">
<h1><center><i>STRING AND MATH FUNCTION</center><i></h1>
<script>
var a="hello";
var b="world";
var c="welcome";
document.write("string1=" + a + "<br>");
document.write("string2=" + b + "<br>");
document.write("string3=" + c + "<br>");

document.write("<h2>String Function</h2>");
document.write("concatination=" + a + b + c + "<br>");
document.write("length of c=" + c.length + "<br>");
document.write("uppercase=" + a.toUpperCase() + "<br>");
document.write("lowercase=" + a.toLowerCase() + "<br>");
document.write("replace=" + a.replace("hello","hi") + "<br>");
document.write("slice=" + a.slice(1,3) + "<br>");
document.write("<h2>Math Function</h2>");
document.write("square root=" + Math.sqrt(25) + "<br>");
document.write("round off 22.56=" + Math.round(22.56) + "<br>");
document.write("power of 2^3=" + Math.pow(2,3) + "<br>");
document.write("absolute value of -5=" + Math.abs(-5) + "<br>");
document.write("ceil 4.33=" + Math.ceil(4.33) + "<br>");
document.write("floor 4.33=" + Math.floor(4.33) + "<br>");
document.write("minimum of 2,3=" + Math.min(2,3) + "<br>");
document.write("maximum of 2,4=" + Math.max(2,4) + "<br>");
</script>
</body>
</html>
